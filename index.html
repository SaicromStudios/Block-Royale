<script>
'use strict';
/* ===== BLOCK ROYALE: Block-Survival-Shooter ===== */
const TS=32,COLS=30,ROWS=17,W=COLS*TS,H=ROWS*TS,REACH=176;

try{const o=JSON.parse(localStorage.getItem('blockRoyaleWorlds')||'{}');if(o.done)WLD.done=[!!o.done[0],!!o.done[1]];WLD.seen=!!o.seen;if(o.sel===1&&WLD.done[0])WLD.sel=1;}catch(e){}
world=WLD.sel;
function wldSave(){try{localStorage.setItem('blockRoyaleWorlds',JSON.stringify({done:WLD.done,sel:WLD.sel,seen:WLD.seen}));}catch(e){}}
const cv=document.getElementById('c');let ctx=cv.getContext('2d');const DPR=Math.min(3,Math.max(2,Math.ceil(devicePixelRatio||1)));cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
// Blocktypen
const GRASS=1,DIRT=2,STONE=3,WOOD=4,LEAF=5,ORE=6,BED=7,BUILT=30,RAMP=31;

const NAT_HP={1:30,2:30,3:70,4:50,5:10,6:100,8:30,7:1e9};
const waveCount=w=>3+Math.round(w*1.7); // Endlos: jede Welle größer
const SKINS=[{n:'JONESY',b:'#8e44ad',a:'#ffd23f',h:'#ff7a00',l:'#2a3d8f'},{n:'RAPTOR',b:'#c0392b',a:'#222',h:'#333',l:'#2c2c2c'},{n:'FROSTY',b:'#2e86de',a:'#fff',h:'#dff6ff',l:'#1b4f8a'}];
const WEAPONS=[
{n:'SCAR',d:'Sturmgewehr – ausgewogen, schnell',cd:.11,dmg:12,sp:950,spr:.05,pel:1,life:1,s:[3,4,3]},
{n:'SNIPER',d:'Hoher Schaden, durchschlägt Gegner',cd:.95,dmg:75,sp:1800,spr:0,pel:1,life:1.5,pierce:2,s:[5,1,5]},
{n:'SHOTGUN',d:'6 Schrotkugeln, nur Nahbereich',cd:.7,dmg:9,sp:800,spr:.3,pel:6,life:.3,s:[4,2,1]},
{n:'SMG',d:'Extrem schnell, wenig Schaden',cd:.06,dmg:6,sp:900,spr:.14,pel:1,life:.7,s:[2,5,2]}];
let T,HP,MT,DR,surf=[];
const mk=v=>Array.from({length:ROWS},()=>Array(COLS).fill(v));
const inb=(c,r)=>c>=0&&c<COLS&&r>=0&&r<ROWS;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const maxHp=(t,m)=>(t===BUILT||t===RAMP)?MAT_HP[m]:NAT_HP[t];
function setT(c,r,t,m=0){T[r][c]=t;MT[r][c]=m;HP[r][c]=maxHp(t,m);}
/* --- Prozedurale Welt --- */
function genWorldRaw(){
  T=mk(0);HP=mk(0);MT=mk(0);DR=mk(0);let h=10,last=-9;
  for(let c=0;c<COLS;c++){
    h=clamp(h+Math.floor(Math.random()*3)-1,8,12);surf[c]=h;

      setT(c,r,t);

  }
  for(let c=3;c<COLS-3;c++){ // Bäume (nicht am Spawn / Rand)
    if(Math.abs(c-15)<3||c-last<(swp()?3:4)||Math.random()>(swp()?.38:.25))continue;
    last=c;const th=3+(Math.random()*2|0),top=surf[c]-th;
    for(let r=surf[c]-1;r>=top;r--)setT(c,r,WOOD);
    for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=0;dy++){const rr=top+dy,cc=c+dx;if(inb(cc,rr)&&!T[rr][cc])setT(cc,rr,LEAF);}
  }
}
/* --- Spielzustand --- */
let state='lobby',time=0,wave=1,toSpawn=0,spawnCd=0,breakT=0,bannerT=0,kills=0,last=0,skin=0,wpn=0,best=[],rank=-1;

let en=[],bullets=[],parts=[],texts=[];

const keys={},mouse={x:W/2,y:H/2,down:false};
/* ===== v6: Effekte, Combos, Tile-Cache ===== */
let shk=0,shx=0,shy=0,combo=0,comboT=0,bestCombo=0,hitMk=0,waveClr=0,hpG=1,shG=.5,ghosts=[],flashes=[],fpsA=60;
const tileCache=new Map(),skyl=new Array(COLS).fill(0),SHD=Array.from({length:9},(_,d)=>'rgba(8,4,24,'+Math.min(.45,d*.06)+')');
const hpCol=()=>P.hp/maxHP()<.3?'#ff4a4a':'#46d94a';
function fxReset(){shk=0;combo=0;comboT=0;bestCombo=0;hitMk=0;waveClr=0;hpG=1;shG=.5;ghosts=[];flashes=[];}
function shake(a){if(cfg.shake)shk=Math.min(14,Math.max(shk,a));}
function comboAdd(e){combo++;comboT=3.2;if(combo>bestCombo)bestCombo=combo;if(combo%10===0){P.sh=Math.min(100,P.sh+10);float(P.x+11,P.y-30,'COMBO x'+combo+'  +10 SHIELD','#ffd23f',18);shake(3);sfx.ping();}if(e&&(e.boss||e.wither))shake(8);}
function fxFrame(dt){
  shk*=Math.pow(.0015,dt);if(shk<.05)shk=0;hitMk-=dt;
  for(let i=ghosts.length-1;i>=0;i--)if((ghosts[i].t-=dt)<=0)ghosts.splice(i,1);
  for(let i=flashes.length-1;i>=0;i--)if((flashes[i].t-=dt)<=0)flashes.splice(i,1);
  if(simOn()&&comboT>0){comboT-=dt;if(comboT<=0)combo=0;}
  const tv=P.hp/maxHP();hpG=hpG>tv?Math.max(tv,hpG-dt*.4):tv;const ts2=P.sh/100;shG=shG>ts2?Math.max(ts2,shG-dt*.4):ts2;
}
function shadowAt(e){
  const cx=e.x+e.w/2,c=clamp(Math.floor(cx/TS),0,COLS-1);let r=clamp(Math.floor((e.y+e.h-1)/TS),0,ROWS-1);
  while(r<ROWS&&(T[r][c]===0||T[r][c]===RAMP||T[r][c]===WOOD||T[r][c]===LEAF))r++;
  if(r>=ROWS)return;const gy=r*TS,d=gy-(e.y+e.h);if(d<-6||d>200)return;
  const k=clamp(1-d/200,.15,1);ctx.fillStyle='rgba(0,0,0,'+(.28*k)+')';ctx.beginPath();ctx.ellipse(cx,gy+1,e.w*.6*(.6+.4*k),3,0,0,7);ctx.fill();
}
function drawComboHUD(){

  bar(12,178,100,8,k,combo>=10?'#ff9f1c':'#4fc3ff');
}
function drawVignette(){
  if(cfg.q>=2){const v=ctx.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,H*.95);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.3)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);}
  if(state==='play'&&P.hp/maxHP()<.3){
    const pl=.5+.5*Math.sin(performance.now()/260),lw=1-P.hp/maxHP()/.3,vg=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.85);
    vg.addColorStop(0,'rgba(200,0,0,0)');vg.addColorStop(1,'rgba(200,0,0,'+((.12+.3*pl)*(.35+.65*lw))+')');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  }
}
const lerpC=(a,b,t)=>{const p=q=>[1,3,5].map(i=>parseInt(q.slice(i,i+2),16)),A=p(a),B=p(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')';};
const TIPS=['X wechselt zwischen Wand und Rampe.','10 Kills in Folge geben +10 Schild (Combo).','Sniper-Schüsse durchschlagen mehrere Gegner.','Der Dash macht dich kurz unverwundbar.','Supply Drops enthalten Heilitems – schnapp sie dir!','Metall-Wände halten am längsten.','Alle Tagesmissionen = Coin-Booster x1,5.','F3 zeigt die FPS-Anzeige.','Der erste Erztitan schaltet den Petstore frei.','Nach 30 Minuten erscheint der Seelenschnitter.','Wellen komplett besiegt = +10 Schild.'];
function reset(){
  genWorld();Object.assign(P,{x:15*TS+5,y:0,vx:0,vy:0,hp:maxHP(),sh:50,cd:0,mineCd:0,storm:0,hurtT:0});
  qRunStart();fxReset();resetBossFx();drillWarn=[];en=[];bullets=[];parts=[];texts=[];heal=[1,0,0];drops=[];runCoins=0;spikes=[];winT=0;wx=(swp()?['rain','dark','dark','thunder']:['sun','rain','thunder','dark'])[Math.random()*4|0];wxA=1;nextWx=120;lightT=0;boostT=0;snowOn=false;booms=[];dst=dmax();dcd=0;P.dashT=0;P.invT=0;abReset();nextBoss=600;nextDrop=60;msgT=0;time=0;vt=0;wave=1;kills=0;sel=0;mat=0;buildMode=0;inv=[40,20,10];
  startWave();state='play';
}
function startWave(){toSpawn=waveCount(wave);spawnCd=1;breakT=0;bannerT=2.5;waveClr=0;}
/* --- Physik: AABB-Kollision gegen Blöcke + Rampen --- */
function solid(c,r){if(c<0||c>=COLS||r>=ROWS)return true;if(r<0)return false;const t=T[r][c];return t!==0&&t!==RAMP;}
// Gegner (ghost) laufen durch Bäume (Holz + Laub)
const sol=(e,c,r)=>solid(c,r)&&!(e.ghost&&inb(c,r)&&(T[r][c]===WOOD||T[r][c]===LEAF));
function move(e,dt){
  e.blocked=false;e.x+=e.vx*dt;
  let x0=Math.floor(e.x/TS),x1=Math.floor((e.x+e.w-.01)/TS),y0=Math.floor(e.y/TS),y1=Math.floor((e.y+e.h-.01)/TS);
  for(let r=y0;r<=y1;r++)for(let c=x0;c<=x1;c++)if(sol(e,c,r)){
    if(e.vx>0)e.x=c*TS-e.w;else if(e.vx<0)e.x=(c+1)*TS;e.vx=0;e.blocked=true;}
  e.vy=Math.min(e.vy+1100*dt,900);e.y+=e.vy*dt;e.onGround=false;
  x0=Math.floor(e.x/TS);x1=Math.floor((e.x+e.w-.01)/TS);y0=Math.floor(e.y/TS);y1=Math.floor((e.y+e.h-.01)/TS);
  for(let r=y0;r<=y1;r++)for(let c=x0;c<=x1;c++)if(e.vy!==0&&sol(e,c,r)){
    if(e.vy>0){e.y=r*TS-e.h;e.onGround=true;}else e.y=(r+1)*TS;e.vy=0;}
  // Rampen: Höhe der Schräge an der Fußposition
  const cx=e.x+e.w/2,c=Math.floor(cx/TS),feet=e.y+e.h,r=Math.floor((feet-1)/TS);
  if(inb(c,r)&&T[r][c]===RAMP){
    const u=clamp((cx-c*TS)/TS,0,1),k=DR[r][c]>0?u:1-u,sy=(r+1)*TS-k*TS;
    if(feet>sy){e.y=sy-e.h;e.vy=0;e.onGround=true;}
  }
}
/* --- Effekte --- */
const blockCol=(t,m)=>t===8?'#f4faff':t===GRASS?'#4caf2a':t===DIRT?'#8b5a2b':t===STONE?'#8a8a8a':t===WOOD?'#7a5230':t===LEAF?'#2e8b2e':t===ORE?'#d9a066':t>=BUILT?MAT_COL[m][0]:'#fff';
function burst(x,y,col,n){const cap=[120,350,800][cfg.q|0];if(parts.length>cap)return;if(cfg.q===0)n=Math.ceil(n/2);for(let i=0;i<n;i++){const l=.5+Math.random()*.3;parts.push({x,y,vx:(Math.random()-.5)*220,vy:-Math.random()*220,life:l,mx:l,col,s:3+Math.random()*3});}}
function float(x,y,txt,col,size=16){texts.push({x,y,txt,col,size,life:.9});}
let hurtSrc=null;
function hurt(d,col='#ff5a5a'){
  const hs=hurtSrc;hurtSrc=null;if(tgtR){mpDmg(tgtR,d);return;}if(state==='spec'||P.dead)return;mlReflect(d,hs);if(P.invT>0)return;d=Math.max(1,Math.round(d*(1-shieldPct()/100)));const s=Math.min(P.sh,d);P.sh-=s;P.hp-=d-s;P.hurtT=.2;sfx.hurt();shake(2+Math.min(6,d*.25));float(P.x+P.w/2,P.y-4,'-'+d,col,18);
}
/* --- Blöcke abbauen / zerstören / bauen --- */
function hitBlock(c,r,dmg,byPlayer,crit){
  if(!inb(c,r)||!T[r][c]||T[r][c]===BED)return;
  HP[r][c]-=dmg;float(c*TS+16,r*TS+4,''+Math.round(dmg),crit?'#ffd23f':'#fff',crit?20:15);
  burst(c*TS+16,r*TS+16,blockCol(T[r][c],MT[r][c]),2);
  if(HP[r][c]<=0){
    const t=T[r][c];burst(c*TS+16,r*TS+16,blockCol(t,MT[r][c]),10);T[r][c]=0;sfx.brk();mpBlk(c,r,0);
    if(byPlayer){qAdd('mine',1);const k=t===WOOD?0:t===STONE?1:t===ORE?2:-1;if(k>=0){inv[k]++;float(c*TS+16,r*TS-8,'+1 '+MATS[k],'#8cff8c',14);}}
  }
}
const overlap=(a,x,y,w,h)=>a.x<x+w&&a.x+a.w>x&&a.y<y+h&&a.y+a.h>y;
function place(){
  const c=Math.floor(mouse.x/TS),r=Math.floor(mouse.y/TS);
  if(!inb(c,r)||T[r][c]!==0)return;
  const dx=c*TS+16-(P.x+P.w/2),dy=r*TS+16-(P.y+P.h/2);if(Math.hypot(dx,dy)>REACH+TS)return;
  if(inv[mat]<10){float(P.x+P.w/2,P.y-14,'Need 10 '+MATS[mat],'#ffd23f',14);return;}
  if(buildMode===0&&(overlap(P,c*TS,r*TS,TS,TS)||en.some(e=>overlap(e,c*TS,r*TS,TS,TS))))return;
  setT(c,r,buildMode?RAMP:BUILT,mat);sfx.place();DR[r][c]=mouse.x>P.x+P.w/2?1:-1;inv[mat]-=10;mpBlk(c,r,T[r][c],mat,DR[r][c]);burst(c*TS+16,r*TS+16,MAT_COL[mat][0],5);qAdd('build',1);
}
function mine(){
  const c=Math.floor(mouse.x/TS),r=Math.floor(mouse.y/TS);if(!inb(c,r)||!T[r][c])return;
  if(Math.hypot(c*TS+16-(P.x+P.w/2),r*TS+16-(P.y+P.h/2))>REACH)return;
  const crit=Math.random()<.1;hitBlock(c,r,crit?20:10,true,crit);sfx.mine();
}
function shoot(){
  const w=WEAPONS[wpn],px=P.x+P.w/2,py=P.y+14,a0=Math.atan2(mouse.y-py,mouse.x-px);
  for(let i=0;i<w.pel;i++){const a=a0+(Math.random()-.5)*w.spr;
    bullets.push({x:px+Math.cos(a)*18,y:py+Math.sin(a)*18,vx:Math.cos(a)*w.sp,vy:Math.sin(a)*w.sp,life:w.life,dmg:w.dmg*dmgMul(),pierce:w.pierce||0,hit:[],});}
  P.cd=w.cd;qAdd('shots',1);sfx.shoot(wpn);mpShot(a0,w);flashes.push({x:px+Math.cos(a0)*30,y:py+Math.sin(a0)*30,t:.07,s:wpn===2?1.5:wpn===1?1.3:1});if(wpn===2)shake(1.5);else if(wpn===1)shake(2);
}
/* --- Gegner --- */
function spawnEnemyOld(){
  const left=Math.random()<.5,c=left?0:COLS-1,x=left?4:W-26;
  let r=0;while(r<ROWS&&!solid(c,r))r++;
  en.push({x,y:r*TS-34,w:22,h:30,vx:0,vy:0,hp:40+wave*12,max:40+wave*12,sp:Math.min(150,55+wave*6),atk:Math.min(60,12+wave*3),cd:0,hitCd:0,anim:0,dir:1});
}
function updateEnemiesCore(dt){
  for(let i=en.length-1;i>=0;i--){
    const e=en[i],dx=(P.x+P.w/2)-(e.x+e.w/2),dir=Math.sign(dx)||1;
    if(e.rise>0){e.rise-=dt;e.y=e.sy-e.h+(Math.max(0,e.rise)/.4)*(e.h+2);if(!e.rhit&&e.rise<.25&&overlap(e,P.x,P.y,P.w,P.h+4)){e.rhit=1;hurtSrc=e;hurt((8+wave*2)*1.03*1.07,'#ff9a3c');P.slowT=.5;P.vy=Math.min(P.vy,-260);burst(P.x+11,P.y+P.h,'#8b5a2b',8);}if(e.rise<=0){e.y=e.sy-e.h-1;e.vy=0;}continue;}
    if(e.fuse>0){e.fuse-=dt;if(e.fuse<=0){explode(e);en.splice(i,1);continue;}}
    const bs=(e.boss&&!mpGuest())?bossAI(e,dt):(e.kind==='acid'&&!mpGuest())?acidAI(e,dt,dx):0;
    e.dir=dir;e.vx=bs===2?e.lvx:bs===1?0:dir*e.sp*(e.rage?1.25:1);e.anim+=dt;e.hitCd-=dt;move(e,dt);
    if(e.blocked){
      const fx=Math.floor((dir>0?e.x+e.w+2:e.x-2)/TS);let tgt=null;
      for(const yy of [e.y+e.h-4,e.y+e.h/2,e.y+4]){const rr=Math.floor(yy/TS);if(inb(fx,rr)&&T[rr][fx]===BUILT){tgt=rr;break;}}
      if(tgt!==null){e.cd-=dt;if(e.cd<=0){e.cd=.5;hitBlock(fx,tgt,maxHp(BUILT,MT[tgt][fx])*.5/breakTime(),false);}}   // Bauten angreifen
      else if(e.onGround)e.vy=-390;                                                  // Hindernis überspringen
    }else if(e.onGround&&P.y<e.y-40&&Math.abs(dx)<60&&Math.random()<dt*2)e.vy=-390;
    const stomp=!tgtR&&((chr==='mario'&&stompCheck(e))||(chr==='sonic'&&sonicHit(e)));if(!stomp&&e.kind==='bomb'&&!e.exploded&&Math.hypot((P.x+P.w/2)-(e.x+e.w/2),(P.y+P.h/2)-(e.y+e.h/2))<=40){explode(e);en.splice(i,1);continue;}
    if(!stomp&&overlap(e,P.x,P.y,P.w,P.h)&&e.hitCd<=0){e.hitCd=e.kind==='drill'?.14:.8;hurtSrc=e;hurt((8+wave*2)*(e.kind==='drill'?.2:e.wither?1.5:e.boss?(e.mut?2.1:2):e.kind==='baby'?1.03:1)*(mp.on?((e.boss||e.wither)?1.02:1.05):1));}
    if(e.hp<=0){if(e.kind==='bomb'&&!e.exploded)explode(e);burst(e.x+e.w/2,e.y+e.h/2,e.boss?'#c9c9c9':'#5aa64b',e.boss?40:14);if(mpOwn(e)){kills++;qKill(e);boostT=1.5;sfx.die();}else mpGive(e);if(mpOwn(e))addCoins((e.wither||e.sb==='witch')?50:e.boss?10:1,e.x+e.w/2,e.y-16);if(e.wither||e.sb==='witch')winRun();else if(e.boss){if(!e.mut&&!e.sb)unlockPet();drops.push({x:e.x+e.w/2,y:-60,landed:false,id:++dropId});if(!snowOn)enterSnow();}if(mpOwn(e))P.sh=Math.min(100,P.sh+5);en.splice(i,1);}
  }
}
/* --- Sturm --- */
function stormRect(){const p=clamp((time-1800)/120,0,1);return{l:p*330,r:W-p*330,t:p*172,b:H-p*172,p};}
/* --- Hauptupdate --- */
function update(dt){
  if(!simOn())return;
  if(mp.on&&(pz||state==='keys')){for(const k in keys)keys[k]=false;mouse.down=false;P.invT=.3;}

function qCoins(n){coins+=n;try{localStorage.setItem('blockRoyaleCoins',coins);}catch(e){}try{if(sfx.coin)sfx.coin(true);}catch(e){}}
function qToast(s,c){qToasts.push({t:3.6,s,c:c||'#ffd23f'});while(qToasts.length>3)qToasts.shift();if(sfx.ping)sfx.ping();}
function qLoad(){
  let o=null;try{o=JSON.parse(localStorage.getItem(QSAVE)||'null');}catch(e){}
  if(!o||typeof o!=='object')o={};
  const ok=a=>Array.isArray(a)?a.filter(e=>e&&QDEF[e.i]).map(e=>({i:e.i,p:+e.p||0,c:e.c?1:0,o:+e.o||0})):[];
  QS={dk:typeof o.dk==='string'?o.dk:'',wk:typeof o.wk==='string'?o.wk:'',d:ok(o.d),w:ok(o.w),m:{},rr:Math.max(0,o.rr|0),mult:Math.max(0,o.mult|0),bd:typeof o.bd==='string'?o.bd:''};
  for(const q of QM){const e=o.m&&o.m[q.id];QS.m[q.id]={i:q.id,p:e?(+e.p||0):0,c:e&&e.c?1:0};}
  qCheckReset(true);
}
function qCheckReset(first){
  if(!QS)return;
  const dk=qDK(),wk=qWK();let paid=0,ch=false;
  if(QS.dk!==dk){paid+=qPayout(QS.d);QS.dk=dk;QS.rr=0;qRollD();ch=true;if(!first)qToast('Neuer Tag – neue Tagesmissionen!','#8cd8ff');}
  if(QS.wk!==wk){paid+=qPayout(QS.w);QS.wk=wk;qRollW();ch=true;if(!first)qToast('Neue Wochenmissionen!','#8cd8ff');}
  if(QS.d.length!==3){qRollD();ch=true;}
  if(QS.w.length!==3){qRollW();ch=true;}
  if(paid>0){qCoins(paid);msMsg='Offene Belohnungen automatisch gutgeschrieben: +'+paid+' Coins';msMsgUntil=performance.now()+60000;if(!first)qToast('Offene Belohnungen erhalten: +'+paid+' Coins');}
  if(ch){qSave();}
}
// ---- Fortschritt ----
function qEach(f){QS.d.forEach(e=>f(e,'d'));QS.w.forEach(e=>f(e,'w'));for(const q of QM)f(QS.m[q.id],'m');}
function qDone(e,df,k){
  qToast('MISSION ABGESCHLOSSEN: '+df.t,'#8cff8c');qDirty=true;
  if(k==='d'){
    qAdd('dq',1);
    if(QS.d.every(x=>QDEF[x.i]&&x.p>=QDEF[x.i].n)&&QS.bd!==QS.dk){QS.bd=QS.dk;QS.mult++;qToast('ALLE TAGESMISSIONEN GESCHAFFT! COIN-BOOSTER ERHALTEN – ['+keyName(kb.mult)+'] im Spiel','#ffb347');}
  }
  qSave();
}
function qAdd(s,n){
  if(!QS||!(n>0))return;
  qEach((e,k)=>{const df=QDEF[e.i];if(!df||df.s!==s||df.mx||e.p>=df.n)return;e.p=Math.min(df.n,e.p+n);qDirty=true;if(e.p>=df.n)qDone(e,df,k);});
}
function qMax(s,v){
  if(!QS)return;
  qEach((e,k)=>{const df=QDEF[e.i];if(!df||df.s!==s||!df.mx||e.p>=df.n)return;const np=Math.min(df.n,v-(e.o||0));if(np>e.p){e.p=np;qDirty=true;if(e.p>=df.n)qDone(e,df,k);}});
}
function qKill(e){comboAdd(e);
  if(e.wither){qAdd('boss',1);qAdd('wither',1);}
  else if(e.boss){qAdd('boss',1);if(!e.sb)qAdd(e.mut?'mut':'golem',1);}
  else if(e.kind==='baby')qAdd('baby',1);else if(e.kind==='drill')qAdd('drill',1);else if(e.kind==='bomb')qAdd('bomb',1);
}
function qRunStart(){runPlay=0;lastK=0;lastC=0;multT=0;multCarry=0;abUse=0;qAdd('runs',1);}
function qClaim(e){
  const df=QDEF[e.i];if(!df||e.p<df.n||e.c)return;
  e.c=1;qCoins(df.r);qSave();msMsg='+'+df.r+' Coins erhalten!';msMsgUntil=performance.now()+2500;
}
const qClaimable=(arr)=>arr.reduce((a,e)=>a+((QDEF[e.i]&&e.p>=QDEF[e.i].n&&!e.c)?1:0),0);
const qAllClaimable=()=>QS?qClaimable(QS.d)+qClaimable(QS.w)+qClaimable(QM.map(q=>QS.m[q.id])):0;
function qReroll(i){
  const e=QS.d[i],df=QDEF[e.i];if(!df||e.p>=df.n)return;
  const cost=RR_BASE+RR_STEP*QS.rr;
  if(coins<cost){msMsg='Nicht genug Coins! Tausch kostet '+cost+' Coins.';msMsgUntil=performance.now()+2500;if(sfx.hurt)sfx.hurt();return;}
  coins-=cost;try{localStorage.setItem('blockRoyaleCoins',coins);}catch(x){}
  const others=QS.d.filter((_,k)=>k!==i).map(x=>x.i);
  QS.d[i]=qNew(qPick(QD,others,[e.i],[df.g]).id);QS.rr++;qSave();
  if(sfx.buy)sfx.buy();msMsg='Mission getauscht (−'+cost+' Coins). Nächster Tausch heute: '+(RR_BASE+RR_STEP*QS.rr)+' Coins.';msMsgUntil=performance.now()+4000;
}

function activateMult(){
  if(!QS||state!=='play')return;
  if(multT>0){float(P.x+11,P.y-16,'Booster läuft bereits','#ffb347',14);return;}
  if(QS.mult<1){float(P.x+11,P.y-16,'Kein Coin-Booster verfügbar','#ffb347',14);return;}
  QS.mult--;multT=MULT_DUR;multCarry=0;qSave();
  if(sfx.loot)sfx.loot();burst(P.x+11,P.y+15,'#ffd23f',16);float(P.x+11,P.y-16,'COIN-BOOSTER x1,5 – 5:00','#ffd23f',18);
}
// ---- Pro Frame: Reset um 0:00, Statistiken, Booster-Timer ----
function qFrame(dt){
  if(!QS)return;
  const now=performance.now();
  if(now-qLastChk>1000){qLastChk=now;qCheckReset(false);}
  for(let i=qToasts.length-1;i>=0;i--){qToasts[i].t-=dt;if(qToasts[i].t<=0)qToasts.splice(i,1);}
  const inRun=simOn()&&state!=='spec';qInRun=inRun;
  const dk=kills-lastK;if(dk>0)qAdd('kills',dk);lastK=kills;
  const dc=runCoins-lastC;if(dc>0)qAdd('coins',dc);lastC=runCoins;
  if(inRun){runPlay+=dt;qAdd('time',dt);qMax('runtime',runPlay);}
  // Booster verschwindet bei Tod / Rückkehr in die Lobby
  const alive=state==='play'||state==='pause'||(state==='keys'&&setFrom!=='lobby')||(state==='missions'&&msFrom!=='lobby');
  if(multT>0&&!alive){multT=0;multCarry=0;}
  if(inRun&&multT>0){multT-=dt;if(multT<=0){multT=0;multCarry=0;qToast('Der Coin-Booster ist abgelaufen.','#ffb347');}}
  qSv+=dt;if(qDirty&&qSv>3)qSave();
}

const MST=i=>({x:132+i*235,y:70,w:225,h:40}),MSC=i=>({x:60,y:134+i*96,w:840,h:88}),MSR=i=>({x:60,y:130+i*58,w:840,h:52});

function qMainOrder(){
  const a=QM.map((q,i)=>({q,i,e:QS.m[q.id]}));
  const rk=o=>o.e.c?2:(o.e.p>=o.q.n?0:1);

function qProg(df,e){
  const tm=df.s==='time'||df.s==='runtime';

  return Math.floor(e.p).toLocaleString('de-DE')+' / '+df.n.toLocaleString('de-DE');

function missionsClick(){
  if(hit(BACK,mouse.x,mouse.y)){qBack();return;}
  if(!QS)return;
  for(let i=0;i<3;i++)if(hit(MST(i),mouse.x,mouse.y)){msTab=i;msPage=0;msArm=-1;return;}
  if(msTab<2){
    const arr=msTab===0?QS.d:QS.w;
    for(let i=0;i<3;i++){
      const r=MSC(i),b={x:r.x+r.w-200,y:r.y+16,w:182,h:56},e=arr[i],df=QDEF[e.i];if(!hit(b,mouse.x,mouse.y)||!df)continue;
      if(e.p>=df.n){qClaim(e);msArm=-1;}
      else if(msTab===0){if(msArm===i){msArm=-1;qReroll(i);}else{msArm=i;msArmT=performance.now();}}
      return;
    }
  }else{
    const ord=qMainOrder(),pages=Math.max(1,Math.ceil(ord.length/MSPER));
    if(hit(MSPREV,mouse.x,mouse.y)){msPage=Math.max(0,msPage-1);return;}
    if(hit(MSNEXT,mouse.x,mouse.y)){msPage=Math.min(pages-1,msPage+1);return;}
    ord.slice(msPage*MSPER,msPage*MSPER+MSPER).forEach((o,i)=>{const r=MSR(i),b={x:r.x+r.w-170,y:r.y+7,w:154,h:38};if(hit(b,mouse.x,mouse.y))qClaim(o.e);});

function acidAI(e,dt,dx){
  const dist=Math.abs(dx),ex=e.x+e.w/2,px=P.x+P.w/2,dir=Math.sign(dx)||1;
  if(e.sc===undefined)e.sc=1.2+Math.random()*1.5;

  if(e.sa>0){
    e.sa-=dt;
    if(e.sa<=0){
      const tx=clamp(px+P.vx*.45,30,W-30);
      bfx.gl.push({x0:ex+dir*6,y0:e.y+6,tx,ty:gndY(tx,P.y+P.h),t:0,T:.7,delay:0,own:e,pl:2.2,pr:34});
      sfx.bSpit();burst(ex+dir*8,e.y+6,'#7bff4a',6);e.sc=3.2+Math.random()*1.4;
    }
    return 1;
  }
  if(e.sc<=0&&dist>90&&dist<380&&e.onGround){e.sa=.65;sfx.bSpitW();return 1;}
  if(dist>300)return 0;
  if(dist<130&&e.nr<=0){if(e.blocked)e.nr=1.2;else{e.lvx=-dir*e.sp*.9;return 2;}}
  if(dist<130)return 0;
  return 1;
}
